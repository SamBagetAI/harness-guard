<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 210" width="240" height="210" role="img" aria-label="Harness Guard's mascot: a small German shepherd in a harness, with a shield on its chest, keeping watch">
  <title>Harness Guard shepherd</title>
  <style>
    /* The dog keeps watch: its head turns a little, its ears perk, its tail wags, it blinks,
       and a glint runs across the shield on its harness. */
    .head { transform-box: fill-box; transform-origin: 50% 90%; animation: watch 4s ease-in-out infinite; }
    .ear-l { transform-box: fill-box; transform-origin: 80% 100%; animation: perk 4s ease-in-out infinite; }
    .ear-r { transform-box: fill-box; transform-origin: 20% 100%; animation: perk 4s ease-in-out infinite reverse; }
    .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 0.6s ease-in-out infinite alternate; }
    .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4s infinite; }
    .glint { animation: glint 4s ease-in-out infinite; }
    @keyframes watch { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-6deg) } 60% { transform: rotate(5deg) } }
    @keyframes perk { 0%, 100% { transform: rotate(0) } 30% { transform: rotate(-8deg) } 40% { transform: rotate(4deg) } }
    @keyframes wag { from { transform: rotate(-10deg) } to { transform: rotate(14deg) } }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1) } 94% { transform: scaleY(0.1) } }
    @keyframes glint { 0%, 55% { transform: translateX(-40px); opacity: 0 } 60% { opacity: 1 } 75%, 100% { transform: translateX(40px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>
  <defs>
    <clipPath id="shield"><path d="M120 128 L142 135 C142 158 134 170 120 177 C106 170 98 158 98 135 Z"/></clipPath>
  </defs>

  <!-- ground -->
  <ellipse cx="122" cy="200" rx="78" ry="6" fill="#e9e2d3"/>

  <!-- bushy tail, behind the body -->
  <path class="tail" d="M156 188 C182 188 196 168 196 142 C196 134 186 132 184 140 C180 160 170 172 152 174 Z" fill="#2b2420" stroke="#1d1b18" stroke-width="3" stroke-linejoin="round"/>

  <!-- body: tan, with the dark saddle on the shoulders, chest and front legs -->
  <path d="M74 198 C66 160 80 116 120 112 C160 116 174 160 166 198 Z" fill="#d8913f" stroke="#1d1b18" stroke-width="3" stroke-linejoin="round"/>
  <path d="M75 190 C70 156 84 120 112 113 C100 124 90 150 90 190 Z M165 190 C170 156 156 120 128 113 C140 124 150 150 150 190 Z" fill="#2b2420"/>
  <path d="M96 196 C92 166 104 140 120 138 C136 140 148 166 144 196 Z" fill="#f3c98a"/>
  <path d="M98 198 V170 M142 198 V170" stroke="#1d1b18" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M86 198 C86 190 92 186 99 186 C106 186 110 190 110 198 Z M130 198 C130 190 134 186 141 186 C148 186 154 190 154 198 Z" fill="#f3c98a" stroke="#1d1b18" stroke-width="3" stroke-linejoin="round"/>

  <!-- the harness: collar, chest strap, and the shield it carries -->
  <path d="M92 126 C104 134 136 134 148 126" fill="none" stroke="#1a3ad8" stroke-width="9" stroke-linecap="round"/>
  <path d="M78 166 C96 174 144 174 162 166" fill="none" stroke="#1a3ad8" stroke-width="9" stroke-linecap="round"/>
  <path d="M120 128 L142 135 C142 158 134 170 120 177 C106 170 98 158 98 135 Z" fill="#1a3ad8" stroke="#1d1b18" stroke-width="3" stroke-linejoin="round"/>
  <path d="M110 151 L117 158 L131 143" fill="none" stroke="#fffdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g clip-path="url(#shield)"><path class="glint" d="M112 126 L122 126 L110 180 L100 180 Z" fill="#fffdf8" opacity=".5"/></g>

  <!-- head: a German shepherd's tall dark ears, dark cap and mask, tan face -->
  <g class="head">
    <path class="ear-l" d="M88 70 C76 52 74 30 80 12 C96 20 108 36 112 52 Z" fill="#2b2420" stroke="#1d1b18" stroke-width="3" stroke-linejoin="round"/>
    <path class="ear-l" d="M92 60 C86 46 85 34 87 25 C97 31 103 41 105 50 Z" fill="#a8674a"/>
    <path class="ear-r" d="M152 70 C164 52 166 30 160 12 C144 20 132 36 128 52 Z" fill="#2b2420" stroke="#1d1b18" stroke-width="3" stroke-linejoin="round"/>
    <path class="ear-r" d="M148 60 C154 46 155 34 153 25 C143 31 137 41 135 50 Z" fill="#a8674a"/>
    <path d="M120 40 C146 40 160 58 160 80 C160 104 142 120 120 120 C98 120 80 104 80 80 C80 58 94 40 120 40 Z" fill="#d8913f" stroke="#1d1b18" stroke-width="3" stroke-linejoin="round"/>
    <path d="M86 58 C96 42 144 42 154 58 C142 62 130 64 125 78 L120 86 L115 78 C110 64 98 62 86 58 Z" fill="#2b2420"/>
    <path d="M120 82 C136 82 146 92 146 103 C146 114 135 120 120 120 C105 120 94 114 94 103 C94 92 104 82 120 82 Z" fill="#f3c98a"/>
    <path d="M114 80 C112 88 110 92 110 96 L130 96 C130 92 128 88 126 80 Z" fill="#2b2420"/>
    <ellipse cx="104" cy="66" rx="4" ry="2.6" fill="#f3c98a"/>
    <ellipse cx="136" cy="66" rx="4" ry="2.6" fill="#f3c98a"/>
    <g class="blink"><circle cx="106" cy="77" r="5" fill="#1d1b18"/><circle cx="108" cy="75" r="1.6" fill="#fffdf8"/></g>
    <g class="blink"><circle cx="134" cy="77" r="5" fill="#1d1b18"/><circle cx="136" cy="75" r="1.6" fill="#fffdf8"/></g>
    <path d="M111 95 C111 90 129 90 129 95 C129 100 123 103 120 103 C117 103 111 100 111 95 Z" fill="#1d1b18"/>
    <ellipse cx="116" cy="93" rx="2.5" ry="1.4" fill="#fffdf8" opacity=".6"/>
    <path d="M116 110 C116 117 124 117 124 110 Z" fill="#e8707a" stroke="#1d1b18" stroke-width="2" stroke-linejoin="round"/>
    <path d="M120 103 V108 M110 107 C113 112 118 111 120 108 C122 111 127 112 130 107" fill="none" stroke="#1d1b18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="97" cy="98" rx="5" ry="3" fill="#ef9f8a" opacity=".6"/>
    <ellipse cx="143" cy="98" rx="5" ry="3" fill="#ef9f8a" opacity=".6"/>
  </g>
</svg>
