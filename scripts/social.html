<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* GitHub's repo card: 1280×640, with everything that matters inside an 80px border. */
  body { margin: 0; width: 1280px; height: 640px; background: #fff; font-family: -apple-system, "Helvetica Neue", system-ui, sans-serif; color: #1d1b18; }
  .safe { position: absolute; left: 80px; top: 80px; width: 1120px; height: 480px; display: flex; align-items: center; justify-content: center; gap: 48px; }
  .dog { width: 400px; display: block; }
  .name { font-size: 92px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .line { font-size: 34px; line-height: 1.3; color: #4a4a47; margin-top: 22px; max-width: 600px; }
  .mark { background: linear-gradient(transparent 55%, #ffe58a 55%); }
</style>
</head>
<body>
<div class="safe">
  <img class="dog" src="../docs/guard.svg" alt="">
  <div>
    <div class="name">Harness Guard</div>
    <div class="line">Check your agent's whole harness <span class="mark">before you trust it</span>.</div>
  </div>
</div>
</body>
</html>
